<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F7E46">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tactiekbord">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Tactiekbord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=Big+Shoulders+Display:wght@800&display=swap">
<style>
/* Layout: het veld is het hoofdobject (links, schermhoog); de trainer-kaart rechts, op telefoon eronder */
:root{
  --bg:#ECF0EB; --surface:#FFFFFF; --ink:#14201A; --muted:#58675E; --line:#D3DAD4; --chip:#E1E7E2;
  --accent:#D3402A; --accent-ink:#FFFFFF;
  --good:#1D7F45; --good-bg:#E2F3E8; --ok:#9A6A00; --ok-bg:#FBF0D3; --bad:#C0352B; --bad-bg:#FBE4E1;
  --home:#D3402A; --home-gk:#F2C230; --away:#1D4FC4; --away-gk:#1F9C68;
  --grass-a:#2F7E46; --grass-b:#2A7340; --chalk:#F3F6F1;
  --f-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-label:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1511; --surface:#17211B; --ink:#E6EDE8; --muted:#93A399; --line:#2A362F; --chip:#212C25;
    --accent:#FF6A4F; --accent-ink:#1A0A06;
    --good:#5BD38A; --good-bg:#15301F; --ok:#F2C14E; --ok-bg:#33290F; --bad:#FF7A6B; --bad-bg:#3A1A16;
    --grass-a:#256A3A; --grass-b:#215F34; --chalk:#E9EFE7;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1511; --surface:#17211B; --ink:#E6EDE8; --muted:#93A399; --line:#2A362F; --chip:#212C25;
  --accent:#FF6A4F; --accent-ink:#1A0A06;
  --good:#5BD38A; --good-bg:#15301F; --ok:#F2C14E; --ok-bg:#33290F; --bad:#FF7A6B; --bad-bg:#3A1A16;
  --grass-a:#256A3A; --grass-b:#215F34; --chalk:#E9EFE7;
  color-scheme:dark;
}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:1140px;margin:0 auto;padding-block:16px 36px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:6px 16px;flex-wrap:wrap;margin-bottom:14px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,6vw,2.9rem);text-transform:uppercase;line-height:.85;margin:0}
.sub{margin:0;color:var(--muted);font:600 .95rem var(--f-label);letter-spacing:.06em;text-transform:uppercase}

.app{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:24px;align-items:start}
@media (max-width:820px){.app{grid-template-columns:minmax(0,1fr);gap:16px}}
.pitch-box{position:relative;width:min(100%, calc((100dvh - 110px) * 74 / 111));min-width:min(100%,300px);aspect-ratio:74/111;margin-inline:auto}
@media (max-width:820px){.pitch-box{width:min(100%, calc(62dvh * 74 / 111))}}
.pitch-box svg{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none;border-radius:8px;background:var(--grass-b)}
.grass-a{fill:var(--grass-a)} .grass-b{fill:var(--grass-b)}
.lines *{fill:none;stroke:var(--chalk);stroke-width:.35}
.lines .spot{fill:var(--chalk);stroke:none}
.dir{font:700 2px var(--f-label);fill:var(--chalk);opacity:.55;letter-spacing:.2px;text-anchor:middle}

.pl .disc{stroke:#fff;stroke-width:.4}
.pl.us .disc{fill:var(--home)} .pl.us.gk .disc{fill:var(--home-gk)}
.pl.them .disc{fill:var(--away)} .pl.them.gk .disc{fill:var(--away-gk)}
.pl .code{font:700 1.85px var(--f-label);fill:#fff;text-anchor:middle;pointer-events:none}
.pl.us.gk .code{fill:#2A2205}
.pl.dim{opacity:.45}
.pl .ring{fill:none;stroke:#fff;stroke-width:.4;stroke-dasharray:1 .6}
.pl .tag rect{fill:#fff}
.pl .tag text{font:700 1.7px var(--f-label);fill:#14201A;text-anchor:middle;letter-spacing:.1px}
.pl.pick{cursor:pointer}
.pl.pick:hover .disc{stroke-width:.8}
.ball .b{fill:#fff;stroke:#1a1a1a;stroke-width:.28}
.ball .p{fill:#1a1a1a}
.mark{cursor:pointer}
.mark line{stroke-width:.45;stroke-dasharray:1.2 .8;stroke-linecap:round}
.mark.run line{stroke:#fff} .mark.pass line{stroke:#FFD84D}
.mark circle{stroke:#14201A;stroke-width:.25}
.mark.run circle{fill:#fff} .mark.pass circle{fill:#FFD84D}
.mark text{font:700 2.3px var(--f-label);fill:#14201A;text-anchor:middle;pointer-events:none}
.mark:hover circle{stroke-width:.5}
.trail line{stroke-width:.4;stroke-linecap:round;opacity:.8}
.trail .tb{stroke:#FFD84D;stroke-dasharray:1 .7}
.trail .tm{stroke:#fff;stroke-dasharray:.6 .6}

.caption{position:absolute;left:10px;right:10px;top:10px;background:rgb(10 22 15 / .86);color:#fff;border-radius:8px;padding:9px 12px;font:600 1rem/1.3 var(--f-body);text-align:center;pointer-events:none}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:18px;min-width:0}
.panel section{display:flex;flex-direction:column;gap:9px}
h2{font:700 .8rem/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
h3{font:700 1.3rem/1.2 var(--f-body);margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px;gap:2px;align-self:flex-start}
.seg button{font:600 .95rem/1 var(--f-label);letter-spacing:.05em;text-transform:uppercase;border:0;background:transparent;color:var(--muted);padding:9px 16px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .18)}
select{font:500 1rem var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.poschip{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--chip);font-weight:600}
.poschip .dot{width:14px;height:14px;border-radius:50%;background:var(--home);flex:none}
.phases{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.phase{display:flex;flex-direction:column;gap:2px;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;cursor:pointer;font:inherit}
.phase b{font:700 1.05rem/1.1 var(--f-label);letter-spacing:.04em;text-transform:uppercase}
.phase span{font-size:.85rem;color:var(--muted);line-height:1.3}
.phase[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.btn{font:700 1rem/1 var(--f-label);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:12px 14px;border-radius:9px;cursor:pointer}
.btn:hover{background:var(--chip)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06);background:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 auto}
.linkbtn{border:0;background:none;color:var(--muted);font:600 .9rem var(--f-body);text-decoration:underline;cursor:pointer;padding:0;align-self:flex-start}

.topline{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:700 .78rem/1 var(--f-label);letter-spacing:.08em;text-transform:uppercase;background:var(--chip);color:var(--ink);padding:6px 9px;border-radius:999px}
.chip.ph{background:var(--accent);color:var(--accent-ink)}
.progress{font:700 .9rem var(--f-label);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:5px;background:var(--chip);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:11px 12px;cursor:pointer;font:500 1rem/1.35 var(--f-body)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.letter{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 .95rem var(--f-label);background:var(--ink);color:var(--surface)}
.letter.pass{background:#E3B500;color:#14201A}
.opt .kind{display:block;font:700 .72rem var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:1px}

.verdict{border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.verdict .vt{font:700 1.5rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.verdict.g{background:var(--good-bg)} .verdict.g .vt{color:var(--good)}
.verdict.r{background:var(--ok-bg)} .verdict.r .vt{color:var(--ok)}
.verdict.f{background:var(--bad-bg)} .verdict.f .vt{color:var(--bad)}
.rate{flex:none;font:700 .75rem/1 var(--f-label);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:999px}
.rate.g{background:var(--good-bg);color:var(--good)} .rate.r{background:var(--ok-bg);color:var(--ok)} .rate.f{background:var(--bad-bg);color:var(--bad)}
.all{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.all li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.all li:first-child{border-top:0}
.all .lbl{flex:1;min-width:0;font-size:.95rem}
.all .mine{font:700 .7rem var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block}
.watch{flex:none;font:700 .85rem/1 var(--f-label);letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 10px;cursor:pointer}
.watch:hover:not(:disabled){background:var(--chip)}
.watch:disabled{opacity:.5;cursor:default}
.running{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:600}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

.score{display:flex;align-items:baseline;gap:10px}
.score .big{font:800 3.4rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tally div{border-radius:10px;padding:10px;text-align:center}
.tally b{display:block;font:800 1.8rem/1 var(--f-display)}
.tally span{font:700 .75rem var(--f-label);letter-spacing:.1em;text-transform:uppercase}
.tally .g{background:var(--good-bg);color:var(--good)} .tally .r{background:var(--ok-bg);color:var(--ok)} .tally .f{background:var(--bad-bg);color:var(--bad)}
.best{font-size:.9rem;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;counter-reset:st}
.steps li{counter-increment:st;font:700 .74rem/1.1 var(--f-label);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:3px solid var(--chip);padding-top:6px}
.steps li::before{content:counter(st) " · "}
.steps li.done{color:var(--ink);border-color:var(--ink)}
.steps li.on{color:var(--accent);border-color:var(--accent)}
.sitlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.sitlist button{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;cursor:pointer;font:600 1rem var(--f-body)}
.sitlist button:hover{border-color:var(--ink)}
.sitlist .nm{flex:1;min-width:0}
.sitlist .ph{font:700 .7rem var(--f-label);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block}
.sitlist .go{flex:none;font:700 .85rem var(--f-label);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.sitlist .done-tag{flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.pulse{animation:none}}
</style>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Tactiekbord</h1>
    <p class="sub" id="sub">Lees het spel. Maak de juiste keuze.</p>
  </header>
  <div class="app">
    <div class="pitch-box">
      <svg id="pitch" viewBox="-3 -3 74 111" aria-label="Voetbalveld">
        <g id="grass"></g>
        <g class="lines">
          <rect x="0" y="0" width="68" height="105"/>
          <line x1="0" y1="52.5" x2="68" y2="52.5"/>
          <circle cx="34" cy="52.5" r="9.15"/>
          <circle class="spot" cx="34" cy="52.5" r=".45"/>
          <rect x="13.84" y="0" width="40.32" height="16.5"/>
          <rect x="24.84" y="0" width="18.32" height="5.5"/>
          <circle class="spot" cx="34" cy="11" r=".45"/>
          <path d="M26.69 16.5 A9.15 9.15 0 0 0 41.31 16.5"/>
          <rect x="13.84" y="88.5" width="40.32" height="16.5"/>
          <rect x="24.84" y="99.5" width="18.32" height="5.5"/>
          <circle class="spot" cx="34" cy="94" r=".45"/>
          <path d="M26.69 88.5 A9.15 9.15 0 0 1 41.31 88.5"/>
          <rect x="30.34" y="-2" width="7.32" height="2"/>
          <rect x="30.34" y="105" width="7.32" height="2"/>
        </g>
        <text class="dir" x="34" y="-0.6" transform="rotate(0)">▲ AANVALSRICHTING</text>
        <g id="trail" class="trail"></g>
        <g id="players"></g>
        <g id="marks"></g>
      </svg>
      <div class="caption" id="caption" hidden></div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
</div>

<script>
/* ===================== Opstellingen ===================== */
const ROLE = {
  K:['gk','Keeper'], LB:['back','Linksback'], RB:['back','Rechtsback'], LA:['back','Linksachter'], RA:['back','Rechtsachter'],
  LWB:['back','Linker wingback'], RWB:['back','Rechter wingback'], LCV:['cv','Linker centrale verdediger'], RCV:['cv','Rechter centrale verdediger'],
  CV:['cv','Centrale verdediger'], '6':['mid6','Controleur (6)'], '8':['mid8','Middenvelder (8)'], '10':['mid8','Aanvallende middenvelder (10)'],
  LW:['wing','Linksbuiten'], RW:['wing','Rechtsbuiten'], LM:['wing','Linkermiddenvelder'], RM:['wing','Rechtermiddenvelder'], ST:['st','Spits']
};
const FORMS = {
  11:{
    '4-3-3':[[34,100,'K'],[10,86,'LB'],[26,88,'LCV'],[42,88,'RCV'],[58,86,'RB'],[20,72,'8'],[34,77,'6'],[48,72,'8'],[12,58,'LW'],[34,56,'ST'],[56,58,'RW']],
    '4-4-2':[[34,100,'K'],[10,86,'LB'],[26,88,'LCV'],[42,88,'RCV'],[58,86,'RB'],[9,72,'LM'],[27,76,'6'],[41,76,'8'],[59,72,'RM'],[27,58,'ST'],[41,57,'ST']],
    '4-2-3-1':[[34,100,'K'],[10,86,'LB'],[26,88,'LCV'],[42,88,'RCV'],[58,86,'RB'],[27,78,'6'],[41,78,'6'],[12,64,'LW'],[34,66,'10'],[56,64,'RW'],[34,54,'ST']],
    '3-5-2':[[34,100,'K'],[18,88,'LCV'],[34,90,'CV'],[50,88,'RCV'],[6,72,'LWB'],[34,78,'6'],[22,70,'8'],[46,70,'8'],[62,72,'RWB'],[27,56,'ST'],[41,56,'ST']],
    '3-4-3':[[34,100,'K'],[18,88,'LCV'],[34,90,'CV'],[50,88,'RCV'],[8,74,'LWB'],[27,76,'6'],[41,76,'8'],[60,74,'RWB'],[13,58,'LW'],[34,55,'ST'],[55,58,'RW']]
  },
  8:{
    '3-3-1':[[34,100,'K'],[12,86,'LA'],[34,88,'CV'],[56,86,'RA'],[12,70,'LM'],[34,74,'6'],[56,70,'RM'],[34,58,'ST']],
    '2-3-2':[[34,100,'K'],[24,88,'LCV'],[44,88,'RCV'],[10,72,'LM'],[34,75,'6'],[58,72,'RM'],[26,58,'ST'],[42,58,'ST']],
    '3-2-2':[[34,100,'K'],[12,86,'LA'],[34,88,'CV'],[56,86,'RA'],[26,74,'6'],[42,74,'8'],[22,58,'ST'],[46,58,'ST']]
  }
};
const OPP_FORM = {11:'4-4-2', 8:'3-3-1'};
const OPP_SHIFT = {aanval:38, omschakelen:28, verdedigen:22};
const PHASES = {
  aanval:['Opbouw & aanval','Jullie hebben de bal. Vanaf de keeper naar voren.'],
  omschakelen:['Omschakelen','Bal net verloren of net gewonnen. Snel kiezen.'],
  verdedigen:['Verdedigen','De tegenstander heeft de bal.'],
  alles:['Alles','Een mix van alle situaties.']
};
const RATE = {g:['Goed',2], r:['Redelijk',1], f:['Fout',0]};

function posName(form, i) {
  const p = form[i], [, name] = ROLE[p[2]];
  const dup = form.filter(q => q[2] === p[2]).length > 1;
  return dup ? name + (p[0] < 34 ? ', links' : ', rechts') : name;
}

/* ===================== Situaties =====================
   Alle coördinaten zijn geschreven voor een speler aan de LINKERkant (x 0-68, y 0 = goal tegenstander, y 105 = eigen goal).
   Voor spelers aan de rechterkant wordt alles gespiegeld.
   setup: ball, me, t = medespelers, o = tegenstanders ([x,y,rolhint]).
   keuze: [soort, doelX, doelY, tekst, beoordeling, uitleg, stappen]
   stap: [onderschrift, ...acties]  acties: ['m',x,y] jij loopt, ['t',vanX,vanY,x,y] medespeler, ['o',vanX,vanY,x,y] tegenstander, ['b',x,y] bal */
const SC = [];
const S = (g, ph, sub, q, setup, opts) => SC.push({ id: SC.length, g, ph, sub, q, setup, opts });

/* ---------- KEEPER ---------- */
S('gk','aanval','Doeltrap','Doeltrap. Hun twee spitsen zetten druk op je centrale verdedigers. Waar speel je de bal naartoe?',
 {ball:[34,99], me:[34,99], t:[[22,96,'cv'],[46,96,'cv'],[6,82,'back'],[34,84,'mid'],[34,46,'st']], o:[[25,92,'st'],[44,90,'st'],[16,72,'wing'],[34,80,'mid'],[34,42,'cv']]},
 [['pass',22,96,'Kort op de linker centrale verdediger','f','De spits staat er bovenop. Je verdediger krijgt de bal met zijn rug naar het veld en verliest hem in jullie eigen zestien.',[
    ['Je speelt kort in op je centrale verdediger.',['b',22,96],['o',25,92,23.5,94.5]],
    ['De spits zit er meteen bovenop en pakt de bal af.',['b',23.8,95],['o',23.5,94.5,24,95.4]],
    ['Hij schiet meteen. Gevaarlijk!',['b',36.5,105]]]],
  ['pass',7,82,'Op de vrije linksback langs de lijn','g','De back staat vrij en kan met zijn gezicht naar voren aannemen. De buitenspeler van de tegenstander staat te ver weg om op tijd te komen.',[
    ['Je speelt de bal strak en vlak naar de back.',['b',7,82],['o',16,72,12,76]],
    ['Hij neemt aan in de loop en dribbelt vooruit.',['t',6,82,9,68],['o',12,76,13,73]],
    ['De druk is gebroken. Jullie spelen op via de vleugel.',['b',22,61],['t',34,84,22,61]]]],
  ['pass',33,45,'Lange bal naar de spits','r','Geen risico bij je eigen goal, maar een lange bal wordt vaak een kopduel. Meestal heeft de tegenstander de bal daarna weer.',[
    ['Je trapt de bal lang naar voren.',['b',33,45],['t',34,46,33,46],['o',34,42,33,44.5]],
    ['Kopduel. De verdediger is er net eerder bij.',['b',27,36],['o',33,44.5,33,43]],
    ['De tegenstander heeft de bal weer.',['o',27,32,27,35.5]]]]

/* ===================== Opslag ===================== */
const KEY = 'tactiekbord.trainer.v2';
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
const saveStore = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
let store = load();
let cfg = Object.assign({ size: 11, form: '4-3-3', pos: 5, phase: 'alles' }, store.cfg || {});
if (!FORMS[cfg.size] || !FORMS[cfg.size][cfg.form]) cfg = { size: 11, form: '4-3-3', pos: 5, phase: 'alles' };
if (!FORMS[cfg.size][cfg.form][cfg.pos]) cfg.pos = 1;
store.best = store.best || {};

/* ===================== Veld & spelers ===================== */
const SVGNS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const svg = $('pitch'), playersG = $('players'), marksG = $('marks'), trailG = $('trail'), cap = $('caption');
const el = (tag, attrs, text) => { const n = document.createElementNS(SVGNS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (text != null) n.textContent = text; return n; };
(function () { const g = $('grass'); for (let i = 0; i < 12; i++) g.appendChild(el('rect', { x: -3, width: 74, y: -3 + i * 9.25, height: 9.26, class: i % 2 ? 'grass-b' : 'grass-a' })); })();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sleep = ms => new Promise(r => setTimeout(r, ms));

let players = [], ball = null, nodes = {}, ballNode = null, mirror = false;
const M = x => mirror ? 68 - x : x;

function drawPlayers(opts = {}) {
  playersG.textContent = ''; nodes = {};
  [...players].sort((a, b) => (a.me ? 1 : 0) - (b.me ? 1 : 0)).forEach(p => {
    const cls = ['pl', p.team, p.gk ? 'gk' : '', p.dim ? 'dim' : '', opts.pick ? 'pick' : ''].join(' ');
    const g = el('g', { class: cls, transform: `translate(${p.x} ${p.y})` });
    if (opts.pick) { g.setAttribute('tabindex', '0'); g.setAttribute('role', 'button'); g.setAttribute('aria-label', p.name); g.dataset.idx = p.idx; }
    g.appendChild(el('circle', { r: 3.4, fill: 'transparent' }));
    if (p.me) g.appendChild(el('circle', { class: 'ring', r: 3.6 }));
    g.appendChild(el('circle', { class: 'disc', r: 2.5 }));
    if (p.team === 'us') g.appendChild(el('text', { class: 'code', y: 0.65 }, p.code === 'K' ? 'K' : p.code));
    if (p.me) {
      const t = el('g', { class: 'tag', transform: 'translate(0 -5.3)' });
      t.appendChild(el('rect', { x: -2.6, y: -1.35, width: 5.2, height: 2.3, rx: 1.1 }));
      t.appendChild(el('text', { y: 0.55 }, 'JIJ'));
      g.appendChild(t);
    }
    playersG.appendChild(g); nodes[p.id] = g;
  });
  if (ball) {
    ballNode = el('g', { class: 'ball', transform: `translate(${ball.x + 0.9} ${ball.y - 0.9})` });
    ballNode.appendChild(el('circle', { class: 'b', r: 1.05 }));
    ballNode.appendChild(el('circle', { class: 'p', r: 0.38 }));
    playersG.appendChild(ballNode);
  } else ballNode = null;
}
function place() {
  players.forEach(p => { const n = nodes[p.id]; if (n) n.setAttribute('transform', `translate(${p.x.toFixed(2)} ${p.y.toFixed(2)})`); });
  if (ballNode) ballNode.setAttribute('transform', `translate(${(ball.x + 0.9).toFixed(2)} ${(ball.y - 0.9).toFixed(2)})`);
}

/* Opstelling-voorbeeld op het setup-scherm */
function drawSetupPitch() {
  const form = FORMS[cfg.size][cfg.form];
  mirror = false; ball = null;
  players = form.map((p, i) => ({ id: 'u' + i, idx: i, team: 'us', code: p[2], x: p[0], y: p[1], gk: p[2] === 'K', me: i === cfg.pos, name: posName(form, i) }));
  marksG.textContent = ''; trailG.textContent = ''; cap.hidden = true;
  drawPlayers({ pick: true });
  playersG.querySelectorAll('.pick').forEach(n => {
    const go = () => { cfg.pos = +n.dataset.idx; persistCfg(); drawSetupPitch(); renderSetup(); };
    n.addEventListener('click', go);
    n.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });
}

/* Situatie opbouwen */
function buildScene(sc) {
  const form = FORMS[cfg.size][cfg.form], base = form[cfg.pos];
  mirror = base[0] > 36;
  const st = sc.setup, usShift = st.us || 0;
  players = form.map((p, i) => ({ id: 'u' + i, team: 'us', code: p[2], group: ROLE[p[2]][0], gk: p[2] === 'K', me: i === cfg.pos,
    x: p[0], y: p[2] === 'K' ? p[1] : p[1] + usShift, bx: p[0], by: p[1], dim: true }));
  const of = FORMS[cfg.size][OPP_FORM[cfg.size]], sh = OPP_SHIFT[sc.ph];
  of.forEach((p, i) => players.push({ id: 't' + i, team: 'them', code: p[2], group: ROLE[p[2]][0], gk: p[2] === 'K',
    x: 68 - p[0], y: p[2] === 'K' ? 3 : 105 - p[1] + sh, bx: 68 - p[0], by: p[2] === 'K' ? 3 : 105 - p[1] + Math.round(sh * 0.55), dim: true }));
  const me = players.find(p => p.me); me.x = M(st.me[0]); me.y = st.me[1]; me.dim = false;
  assign(st.t || [], players.filter(p => p.team === 'us' && !p.me && !p.gk));
  assign(st.o || [], players.filter(p => p.team === 'them' && !p.gk));
  ball = { x: M(st.ball[0]), y: st.ball[1] };
  players.forEach(p => { if (dist(p, ball) < 2.5) p.dim = false; });
  spread();
}
function assign(points, pool) {
  const used = new Set();
  const pts = points.map(p => ({ x: M(p[0]), y: p[1], hint: p[2] }));
  pts.sort((a, b) => (b.hint ? 1 : 0) - (a.hint ? 1 : 0));
  pts.forEach(pt => {
    const free = pool.filter(p => !used.has(p));
    let cand = pt.hint ? free.filter(p => pt.hint === 'mid' ? (p.group === 'mid6' || p.group === 'mid8') : p.group === pt.hint) : [];
    if (!cand.length) cand = free;
    if (!cand.length) return;
    cand.sort((a, b) => dist(a, pt) - dist(b, pt));
    const p = cand[0]; used.add(p); p.x = pt.x; p.y = pt.y; p.dim = false; p.fixed = true;
  });
}
function spread() {
  for (let it = 0; it < 6; it++) {
    players.forEach(p => {
      if (!p.dim || p.gk) return;
      [...players, { x: ball.x, y: ball.y }].forEach(q => {
        if (q === p) return;
        const d = dist(p, q);
        if (d < 5) {
          const dx = d ? (p.x - q.x) / d : 1, dy = d ? (p.y - q.y) / d : 0, push = (5 - d) * 0.6;
          p.x = clamp(p.x + dx * push, 2, 66); p.y = clamp(p.y + dy * push, 2, 103);
        }
      });
    });
  }
}

/* Keuzes tekenen */
function drawMarks(opts, onPick) {
  marksG.textContent = '';
  const me = players.find(p => p.me);
  opts.forEach(o => {
    const from = o.kind === 'pass' ? ball : me, tx = M(o.x), ty = o.y;
    const g = el('g', { class: 'mark ' + o.kind, tabindex: '0', role: 'button', 'aria-label': `Keuze ${o.letter}: ${o.label}` });
    let bx = tx, by = ty;
    if (Math.hypot(tx - from.x, ty - from.y) < 2) { bx = tx + 4.8; by = ty + 1.5; }
    else g.appendChild(el('line', { x1: from.x, y1: from.y, x2: tx, y2: ty }));
    g.appendChild(el('circle', { cx: bx, cy: by, r: 2.2 }));
    g.appendChild(el('text', { x: bx, y: by + 0.8 }, o.letter));
    if (onPick) {
      g.addEventListener('click', () => onPick(o));
      g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onPick(o); } });
    }
    marksG.appendChild(g);
  });
}

/* ===================== Simulatie ===================== */
let runId = 0;
function nearest(team, x, y, exclMe) {
  let best = null, bd = 1e9;
  players.forEach(p => { if (p.team !== team || (exclMe && p.me)) return; const d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; best = p; } });
  return best;
}
function tween(movers, ballMove, follow, dur, id) {
  return new Promise(res => {
    const t0 = performance.now();
    const frame = now => {
      if (id !== runId) return res(false);
      const t = Math.min(1, (now - t0) / dur), e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      movers.forEach(m => { m.p.x = m.fx + (m.tx - m.fx) * e; m.p.y = m.fy + (m.ty - m.fy) * e; });
      if (ballMove) { const eb = 1 - Math.pow(1 - t, 2); ball.x = ballMove.fx + (ballMove.tx - ballMove.fx) * eb; ball.y = ballMove.fy + (ballMove.ty - ballMove.fy) * eb; }
      else if (follow) { ball.x = follow.p.x + follow.ox; ball.y = follow.p.y + follow.oy; }
      place();
      t < 1 ? requestAnimationFrame(frame) : res(true);
    };
    requestAnimationFrame(frame);
  });
}
async function runSteps(steps) {
  const id = ++runId;
  for (const step of steps) {
    if (id !== runId) return false;
    const [text, ...acts] = step;
    cap.textContent = text; cap.hidden = false;
    const movers = []; let ballMove = null;
    acts.forEach(a => {
      if (a[0] === 'b') { ballMove = { fx: ball.x, fy: ball.y, tx: M(a[1]), ty: a[2] }; trailG.appendChild(el('line', { class: 'tb', x1: ball.x, y1: ball.y, x2: M(a[1]), y2: a[2] })); return; }
      let p, tx, ty;
      if (a[0] === 'm') { p = players.find(q => q.me); tx = M(a[1]); ty = a[2]; trailG.appendChild(el('line', { class: 'tm', x1: p.x, y1: p.y, x2: tx, y2: ty })); }
      else { p = nearest(a[0] === 't' ? 'us' : 'them', M(a[1]), a[2], true); tx = M(a[3]); ty = a[4]; }
      if (!p) return;
      p.dim = false; if (nodes[p.id]) nodes[p.id].classList.remove('dim');
      movers.push({ p, fx: p.x, fy: p.y, tx, ty });
    });
    let follow = null;
    if (!ballMove) {
      const m = movers.find(m => Math.hypot(m.fx - ball.x, m.fy - ball.y) < 1.9);
      if (m) follow = { p: m.p, ox: ball.x - m.fx, oy: ball.y - m.fy };
    }
    let d = 0; movers.forEach(m => d = Math.max(d, Math.hypot(m.tx - m.fx, m.ty - m.fy)));
    const bd = ballMove ? Math.hypot(ballMove.tx - ballMove.fx, ballMove.ty - ballMove.fy) : 0;
    let dur = movers.length ? clamp(d * 55, 600, 1500) : clamp(bd * 26, 450, 1100);
    if (bd && movers.length) dur = Math.max(dur, clamp(bd * 26, 450, 1100));
    if (reduce) dur = 1;
    if (movers.length || ballMove) { const ok = await tween(movers, ballMove, follow, dur, id); if (!ok) return false; }
    await sleep(clamp(text.length * 30, 700, 1700));
  }
  return id === runId;
}

function persistCfg() { store.cfg = cfg; saveStore(); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  };
  panel.querySelectorAll('[data-phase]').forEach(b => b.onclick = () => { cfg.phase = b.dataset.phase; persistCfg(); renderSetup(); });
  $('startBtn').onclick = () => startSession();
  panel.querySelectorAll('[data-sit]').forEach(b => b.onclick = () => startSession(SC[+b.dataset.sit]));
}

function startSession(only) {
  let list;
  if (only) list = [only];
  else {
    list = shuffle(poolFor(groupNow(), cfg.phase));
    if (cfg.phase === 'alles') { const order = { aanval: 0, omschakelen: 1, verdedigen: 2 }; list.sort((a, b) => order[a.ph] - order[b.ph]); }
  }
  session = { list, i: 0, results: [], state: 'intro', opts: [], chosen: null, single: !!only };
  loadScenario();
}
async function intro(sc) {
  const id = ++runId;
  buildScene(sc); trailG.textContent = ''; marksG.textContent = '';
  let holder = null, hd = 2.5;
  players.forEach(p => { const d = dist(p, ball); if (d < hd) { hd = d; holder = p; } });
  const movers = players.map(p => { const m = { p, fx: p.bx, fy: p.by, tx: p.x, ty: p.y }; p.x = p.bx; p.y = p.by; return m; });
  let follow = null;
  if (holder) { follow = { p: holder, ox: ball.x - movers.find(m => m.p === holder).tx, oy: ball.y - movers.find(m => m.p === holder).ty }; ball.x = holder.x + follow.ox; ball.y = holder.y + follow.oy; }
  drawPlayers();
  cap.textContent = 'Kijk goed hoe de situatie ontstaat...'; cap.hidden = false;
  await sleep(reduce ? 300 : 700); if (id !== runId) return false;
  const ok = await tween(movers, null, follow, reduce ? 1 : 2200, id); if (!ok) return false;
  cap.textContent = sc.sub + '. Wat doe jij?';
  await sleep(reduce ? 200 : 600);
  return id === runId;
}
function showChoices() {
  const sc = session.list[session.i];
  resetScene(sc);
  cap.textContent = 'Stop! Wat doe jij? Kies A, B of C.'; cap.hidden = false;
  drawMarks(session.opts, choose);
  session.state = 'ask'; renderPlay();
}
async function playIntro() {
  session.state = 'intro'; renderPlay();
  const ok = await intro(session.list[session.i]);
  if (ok && session && session.state === 'intro') showChoices();
}
function loadScenario() {
  const sc = session.list[session.i];
  session.opts = shuffle(sc.opts.map(o => ({ kind: o[0], x: o[1], y: o[2], label: o[3], rate: o[4], why: o[5], steps: o[6] })))
    .map((o, i) => Object.assign(o, { letter: 'ABC'[i] }));
  session.chosen = null; session.watching = null;
  playIntro();
}
function resetScene(sc) {
  runId++;
  buildScene(sc); trailG.textContent = ''; cap.hidden = true; drawPlayers();
}
async function choose(o) {
  if (session.state !== 'ask') return;
  session.chosen = o; session.state = 'sim';
  session.results.push({ sc: session.list[session.i], rate: o.rate });
  renderPlay();
  await play(o);
  if (session && session.chosen === o && session.state === 'sim') { session.state = 'done'; renderPlay(); }
}
async function play(o) {
  const sc = session.list[session.i];
  resetScene(sc);
  drawMarks([o]);
  marksG.style.opacity = '.55';
  const ok = await runSteps(o.steps);
  marksG.style.opacity = '';
  return ok;
}
async function watch(o) {
  if (session.state === 'sim') return;
  session.state = 'replay'; session.watching = o; renderPlay();
  await play(o);
  if (session && session.state === 'replay') { session.state = 'done'; session.watching = null; renderPlay(); }
}

function renderPlay() {
  const sc = session.list[session.i], total = session.list.length;
  const pts = session.results.reduce((s, r) => s + RATE[r.rate][1], 0);
  $('sub').textContent = posNow();
  const head = `
    <div class="topline">
      <div class="chips"><span class="chip ph">${PHASES[sc.ph][0]}</span><span class="chip">${esc(sc.sub)}</span></div>
      <span class="progress">${session.i + 1} / ${total} · ${pts} pnt</span>
    </div>
    <div class="bar"><i style="width:${(session.i + (session.state === 'ask' || session.state === 'intro' ? 0 : 1)) / total * 100}%"></i></div>
    <ol class="steps">${['Situatie', 'Bekijk', 'Kies', 'Uitkomst'].map((t, k) => {
      const cur = session.state === 'intro' ? 1 : session.state === 'ask' ? 2 : 3;
      return `<li class="${k < cur ? 'done' : k === cur ? 'on' : ''}">${t}</li>`; }).join('')}</ol>`;
  let body = '';
  if (session.state === 'intro') {
    body = `
      <section><h3>${esc(sc.q)}</h3></section>
      <div class="running"><span class="pulse"></span>Kijk op het veld hoe de situatie ontstaat.</div>
      <button type="button" class="btn" id="introSkip">Direct naar de keuze</button>`;
  } else if (session.state === 'ask') {
    body = `
      <section><h3>${esc(sc.q)}</h3></section>
      <div class="opts">${session.opts.map(o => `
        <button type="button" class="opt" data-l="${o.letter}"><span class="letter ${o.kind}">${o.letter}</span>
          <span><span class="kind">${o.kind === 'pass' ? 'Pass' : 'Loopactie'}</span>${esc(o.label)}</span></button>`).join('')}
      </div>
      <p class="muted" style="font-size:.88rem">Tik op een keuze, hier of op het veld. Witte lijn = jij loopt, gele lijn = de bal. Daarna zie je in een simulatie wat er gebeurt.</p>
      <div class="btnrow"><button type="button" class="btn" id="replayIntro">▶ Situatie opnieuw bekijken</button></div>
      <button type="button" class="linkbtn" id="stopBtn">Stoppen en terug naar het begin</button>`;
  } else if (session.state === 'sim') {
    const o = session.chosen;
    body = `
      <section><h3>${esc(sc.q)}</h3></section>
      <div class="opts"><button type="button" class="opt" disabled><span class="letter ${o.kind}">${o.letter}</span><span><span class="kind">Jouw keuze</span>${esc(o.label)}</span></button></div>
      <div class="running"><span class="pulse"></span>Kijk wat er gebeurt...</div>
      <button type="button" class="linkbtn" id="skipBtn">Simulatie overslaan</button>`;
  } else {
    const o = session.chosen, last = session.i === total - 1;
    body = `
      <div class="verdict ${o.rate}">
        <span class="vt">${RATE[o.rate][0]}</span>
        <p><b>${o.letter}. ${esc(o.label)}</b></p>
        <p>${esc(o.why)}</p>
      </div>
      <section>
        <h2>Alle keuzes · bekijk wat er gebeurt</h2>
        <ul class="all">${session.opts.map(x => `
          <li><span class="letter ${x.kind}">${x.letter}</span>
            <span class="lbl">${x === o ? '<span class="mine">Jouw keuze</span>' : ''}${esc(x.label)}</span>
            <span class="rate ${x.rate}">${RATE[x.rate][0]}</span>
            <button type="button" class="watch" data-w="${x.letter}" ${session.state === 'replay' ? 'disabled' : ''}>${session.watching === x ? 'Speelt…' : '▶ Bekijk'}</button></li>`).join('')}
        </ul>
        ${session.watching && session.watching !== o ? `<p style="font-size:.92rem"><b>${RATE[session.watching.rate][0]}:</b> ${esc(session.watching.why)}</p>` : ''}
      </section>
      <div class="btnrow">${session.single ? '<button type="button" class="btn" id="otherBtn">Andere situatie kiezen</button>' : ''}<button type="button" class="btn primary" id="nextBtn">${last ? (session.single ? 'Klaar' : 'Bekijk je score') : 'Volgende situatie'}</button></div>`;
  }
  panel.innerHTML = head + body;
  panel.querySelectorAll('.opt[data-l]').forEach(b => b.onclick = () => choose(session.opts.find(o => o.letter === b.dataset.l)));
  panel.querySelectorAll('[data-w]').forEach(b => b.onclick = () => watch(session.opts.find(o => o.letter === b.dataset.w)));
  const stop = $('stopBtn'); if (stop) stop.onclick = toSetup;
  const isk = $('introSkip'); if (isk) isk.onclick = () => { runId++; showChoices(); };
  const ri = $('replayIntro'); if (ri) ri.onclick = playIntro;
  const skip = $('skipBtn'); if (skip) skip.onclick = () => { runId++; session.state = 'done'; showEnd(); renderPlay(); };
  const next = $('nextBtn'); if (next) next.onclick = () => {
    runId++;
    if (session.i < total - 1) { session.i++; loadScenario(); } else if (session.single) toSetup(); else renderEnd();
  };
  const oth = $('otherBtn'); if (oth) oth.onclick = toSetup;
}
function showEnd() {
  /* simulatie overgeslagen: laat de eindsituatie van de gekozen optie direct zien */
  const sc = session.list[session.i], o = session.chosen;
  buildScene(sc); trailG.textContent = '';
  o.steps.forEach(st => st.slice(1).forEach(a => {
    if (a[0] === 'b') { trailG.appendChild(el('line', { class: 'tb', x1: ball.x, y1: ball.y, x2: M(a[1]), y2: a[2] })); ball.x = M(a[1]); ball.y = a[2]; return; }
    let p, tx, ty;
    if (a[0] === 'm') { p = players.find(q => q.me); tx = M(a[1]); ty = a[2]; }
    else { p = nearest(a[0] === 't' ? 'us' : 'them', M(a[1]), a[2], true); tx = M(a[3]); ty = a[4]; }
    if (!p) return;
    if (!st.slice(1).some(q => q[0] === 'b') && Math.hypot(p.x - ball.x, p.y - ball.y) < 1.9) { ball.x += tx - p.x; ball.y += ty - p.y; }
    p.x = tx; p.y = ty; p.dim = false;
  }));
  marksG.textContent = ''; drawPlayers();
  cap.textContent = o.steps[o.steps.length - 1][0]; cap.hidden = false;
}
function renderEnd() {
  const r = session.results, max = r.length * 2, pts = r.reduce((s, x) => s + RATE[x.rate][1], 0);
  const pct = max ? Math.round(pts / max * 100) : 0;
  const k = bestKey(); if (store.best[k] == null || pct > store.best[k]) { store.best[k] = pct; saveStore(); }
  const c = { g: 0, r: 0, f: 0 }; r.forEach(x => c[x.rate]++);
  const msg = pct >= 80 ? 'Topper! Jij leest het spel goed.' : pct >= 50 ? 'Goed bezig. Bekijk de uitleg bij je foute keuzes nog eens.' : 'Blijf oefenen. Kijk goed naar de simulaties van de goede keuzes.';
  session.state = 'end';
  runId++; cap.hidden = true; marksG.textContent = '';
  panel.innerHTML = `
    <section>
      <h2>${esc(posNow())} · ${PHASES[cfg.phase][0]}</h2>
      <div class="score"><span class="big">${pct}%</span><span class="muted">${pts} van ${max} punten</span></div>
      <p>${msg}</p>
    </section>
    <div class="tally"><div class="g"><b>${c.g}</b><span>Goed</span></div><div class="r"><b>${c.r}</b><span>Redelijk</span></div><div class="f"><b>${c.f}</b><span>Fout</span></div></div>
    <section>
      <h2>Per situatie</h2>
      <ul class="all">${r.map(x => `<li><span class="lbl">${PHASES[x.sc.ph][0]} · ${esc(x.sc.sub)}</span><span class="rate ${x.rate}">${RATE[x.rate][0]}</span></li>`).join('')}</ul>
    </section>
    <div class="btnrow"><button type="button" class="btn primary" id="againBtn">Opnieuw</button><button type="button" class="btn" id="setupBtn">Andere positie</button></div>`;
  $('againBtn').onclick = () => startSession();
  $('setupBtn').onclick = toSetup;
}
function toSetup() { runId++; session = null; drawSetupPitch(); renderSetup(); }

toSetup();
</script>

</body>
</html>
